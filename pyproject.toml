[project]
name = "xinghao-db-analyze"
version = "0.1.0"
description = "A functional rebuild of xinghao-db-analyze"
requires-python = ">=3.11,<3.12"

dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "sanic>=25.0.0,<25.4.0",
    "sanic-ext>=24.0.0,<=24.12.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "sanic-testing>=24.6.0,<26.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
